<!DOCTYPE html>
<html>
<head>
  <title>Cookie Injector</title>
</head>
<body>
  <p>正在處理 cookies 並跳轉...</p>
  <script>
    // 解析 URL 參數
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('target');
    const cookies = urlParams.get('cookies');

    // 檢查是否有 target URL
    if (targetUrl) {
      // 在獨立視窗中開啟目標 URL，指定視窗屬性
      window.open(
        decodeURIComponent(targetUrl),
        '_blank',
        'width=800,height=600,toolbar=no,menubar=no,location=no,status=no'
      );

      // 如果需要處理 cookies
      if (cookies) {
        try {
          const cookiesObj = JSON.parse(decodeURIComponent(cookies));
          // 發送自訂事件給 Chrome 插件
          const event = new CustomEvent('cookieData', { detail: cookiesObj });
          window.dispatchEvent(event);
        } catch (e) {
          console.error('無法解析 cookies:', e);
        }
      }

      // 可選擇關閉當前視窗（視瀏覽器限制）
      // window.close();
    } else {
      console.error('No target URL provided');
      document.body.innerHTML = '<p>錯誤：無效的目標 URL</p>';
    }
  </script>
</body>
</html>
