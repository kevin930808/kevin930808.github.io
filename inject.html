<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Cookie Injector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
      background-color: #f0f0f0;
    }
    p {
      font-size: 18px;
      color: #333;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <p>請點擊以下按鈕以開啟結帳頁面<br>（若無反應，請允許此網站的彈出視窗並檢查瀏覽器設定）</p>
  <button onclick="openTargetWindow()">開啟結帳頁面</button>
  <div id="error-message"></div>
  <script>
    // 解析 URL 參數
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('target');
    const cookies = urlParams.get('cookies');

    // 檢查是否有 target URL
    if (!targetUrl) {
      console.error('No target URL provided');
      document.getElementById('error-message').innerHTML = '<p class="error">錯誤：無效的目標 URL，請檢查連結</p>';
      return;
    }

    // 處理 cookies 並觸發 Chrome 插件事件
    if (cookies) {
      try {
        const cookiesObj = JSON.parse(decodeURIComponent(cookies));
        // 發送自訂事件給 Chrome 插件
        const event = new CustomEvent('cookieData', { detail: cookiesObj });
        window.dispatchEvent(event);
        console.log('Cookies dispatched to extension:', cookiesObj);
      } catch (e) {
        console.error('無法解析 cookies:', e);
        document.getElementById('error-message').innerHTML = '<p class="error">錯誤：無法解析 cookies，請檢查連結格式</p>';
      }
    }

    // 開啟獨立視窗的函數
    function openTargetWindow() {
      const newWindow = window.open(
        decodeURIComponent(targetUrl),
        '_blank',
        'width=800,height=600,toolbar=no,menubar=no,location=no,status=no'
      );
      if (!newWindow || newWindow.closed || typeof newWindow.closed === 'undefined') {
        alert('彈出視窗被阻止！請在瀏覽器設定中允許來自 https://kevin930808.github.io 的彈出視窗，然後再次點擊按鈕。');
      } else {
        // 可選擇關閉當前頁面（視瀏覽器限制）
        // window.close();
      }
    }
  </script>
</body>
</html>
